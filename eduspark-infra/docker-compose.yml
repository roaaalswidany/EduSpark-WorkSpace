# eduspark-workspace/docker-compose.yml

networks:
  eduspark-network:
    name: eduspark-network
    driver: bridge

volumes:
  eduspark-postgres-data:
    name: eduspark-postgres-data
  eduspark-redis-data:
    name: eduspark-redis-data
  eduspark-minio-data:
    name: eduspark-minio-data

services:

  # ─── PostgreSQL 16 Alpine ─────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: eduspark-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - eduspark-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - eduspark-network

  # ─── Redis 7 Alpine ───────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: eduspark-redis
    restart: unless-stopped
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --appendonly yes
      --appendfsync everysec
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - eduspark-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - eduspark-network

  # ─── MinIO (S3-compatible Object Storage) ─────────────────────────────────
  minio:
    image: minio/minio:latest
    container_name: eduspark-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - eduspark-minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 20s
    networks:
      - eduspark-network

  # ─── Adminer (PostgreSQL UI) — نشغّله فقط عند الحاجة ────────────────────
  adminer:
    image: adminer:latest
    container_name: eduspark-adminer
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - eduspark-network
    profiles:
      - tools

  # ─── Redis Commander (Redis UI) — نشغّله فقط عند الحاجة ─────────────────
  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: eduspark-redis-commander
    restart: unless-stopped
    environment:
      REDIS_HOSTS: "local:redis:6379:0:${REDIS_PASSWORD}"
    ports:
      - "8081:8081"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - eduspark-network
    profiles:
      - tools
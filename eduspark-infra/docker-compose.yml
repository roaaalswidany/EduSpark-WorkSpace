networks:
  eduspark-network:
    name: eduspark-network
    driver: bridge

volumes:
  eduspark-postgres-data:
    name: eduspark-postgres-data
  eduspark-redis-data:
    name: eduspark-redis-data

services:

  postgres:
    image: postgres:16-alpine
    container_name: eduspark-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - eduspark-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - eduspark-network

  redis:
    image: redis:7-alpine
    container_name: eduspark-redis
    restart: unless-stopped
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --appendonly yes
      --appendfsync everysec
    ports:
      - "${REDIS_PORT}:6379"
    volumes:
      - eduspark-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - eduspark-network

  # ─── أداة بصرية لإدارة PostgreSQL عبر المتصفح (اختيارية) ──────────
  adminer:
    image: adminer:latest
    container_name: eduspark-adminer
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - eduspark-network
    profiles:
      - tools

  # ─── أداة بصرية لإدارة Redis عبر المتصفح (اختيارية) ───────────────
  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: eduspark-redis-commander
    restart: unless-stopped
    environment:
      REDIS_HOSTS: "local:redis:6379:0:${REDIS_PASSWORD}"
    ports:
      - "8081:8081"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - eduspark-network
    profiles:
      - tools
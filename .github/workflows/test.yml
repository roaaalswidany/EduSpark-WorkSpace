name: Test

on:
  push:
    branches: [main, final-fixes]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: eduspark
          POSTGRES_PASSWORD: eduspark_dev_password
          POSTGRES_DB: eduspark_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U eduspark -d eduspark_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://eduspark:eduspark_dev_password@127.0.0.1:5432/eduspark_test?schema=public
      REDIS_URL: redis://127.0.0.1:6379/1
      NEXTAUTH_SECRET: ci-only-secret-not-for-production
      NEXTAUTH_URL: http://localhost:3000
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Generate Prisma client
        run: cd eduspark && npx prisma generate

      - name: Run migrations on test DB
        run: cd eduspark && npx prisma migrate deploy

      - name: Run test suite
        run: cd eduspark && npx vitest run --reporter=verbose

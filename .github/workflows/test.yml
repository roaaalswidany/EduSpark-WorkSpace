name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: eduspark
          POSTGRES_PASSWORD: eduspark_dev_password
          POSTGRES_DB: eduspark_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U eduspark -d eduspark_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://eduspark:eduspark_dev_password@127.0.0.1:5432/eduspark_test?schema=public
      REDIS_URL: redis://127.0.0.1:6379/1
      NEXTAUTH_SECRET: ci-only-secret-not-for-production
      NEXTAUTH_URL: http://localhost:3000
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # Exact versions from package-lock.json (reproducible, unlike `npm install`).
      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: cd eduspark && npx prisma generate

      - name: Lint
        run: cd eduspark && npm run lint

      # Type errors are reported but do not block yet (first run on real Prisma types).
      # Remove `continue-on-error` once this step is green.
      - name: Type check
        run: cd eduspark && npx tsc --noEmit
        continue-on-error: true

      - name: Run migrations on test DB
        run: cd eduspark && npx prisma migrate deploy

      - name: Run test suite
        run: cd eduspark && npx vitest run --reporter=verbose

  # Proves the Dockerfile actually builds. Informational until it has gone green once.
  docker-build:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build web image (not pushed)
        run: >
          docker build -f eduspark/Dockerfile
          --build-arg NEXT_PUBLIC_CHAT_SERVER_URL=http://localhost:3001
          -t eduspark-web:ci .
